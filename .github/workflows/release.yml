# Builds installers and attaches them to a draft GitHub release.
#   Tag push `v*`  → draft release named after the tag.
#   Manual run     → artifacts on the run page only (no release).
# macOS bundles are ad-hoc signed, not notarized: first launch needs
# right-click → Open (or `xattr -dr com.apple.quarantine perch.app`).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # arm64 → .app + .dmg
            name: macos-arm64
          - os: ubuntu-22.04 # oldest glibc we support → .deb, .rpm, .AppImage
            name: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci && npm run build
      - name: Bundle
        working-directory: crates/perch-desktop
        run: npx --yes @tauri-apps/cli@2 build
      - uses: actions/upload-artifact@v4
        with:
          name: perch-${{ matrix.name }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage

  # Static Linux daemon for remote hosts (docs/ARCHITECTURE.md §3a): no glibc
  # or distro dependency, so one file runs on any Linux box of that CPU.
  perchd:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
          - os: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.arch }}-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@v2
      # The daemon has only ever been exercised on macOS; prove it on Linux
      # before shipping it there.
      - run: cargo test -p perchd
      - run: |
          cargo build --release -p perchd --target "$TARGET"
          cp "target/$TARGET/release/perchd" "perchd-linux-${{ matrix.arch }}"
          file "perchd-linux-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: perchd-linux-${{ matrix.arch }}
          path: perchd-linux-${{ matrix.arch }}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: perchd-linux-${{ matrix.arch }}
