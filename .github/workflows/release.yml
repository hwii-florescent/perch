# Builds installers and attaches them to a draft GitHub release.
#   Tag push `v*`  → draft release named after the tag.
#   Manual run     → artifacts on the run page only (no release).
# macOS bundles are ad-hoc signed, not notarized: first launch needs
# right-click → Open (or `xattr -dr com.apple.quarantine perch.app`).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # arm64 → .app + .dmg
            name: macos-arm64
          - os: ubuntu-22.04 # oldest glibc we support → .deb, .rpm, .AppImage
            name: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # third_party/ghostty, built by ghostty-sys
      # The pinned Ghostty only builds with Zig 0.16.x (see crates/ghostty-sys/build.rs).
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci && npm run build
      # `perch` ships beside the app's executable (bundle.*.files in
      # tauri.conf.json); without it agents get no Perch identity.
      - run: cargo build --release -p perchd --bin perch
      - name: Bundle
        working-directory: crates/perch-desktop
        run: npx --yes @tauri-apps/cli@2 build
      - uses: actions/upload-artifact@v4
        with:
          name: perch-${{ matrix.name }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage

  # Static Linux daemon for remote hosts (docs/ARCHITECTURE.md §3a): no glibc
  # or distro dependency, so one file runs on any Linux box of that CPU.
  perchd:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
          - os: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.arch }}-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # third_party/ghostty, built by ghostty-sys
      # The pinned Ghostty only builds with Zig 0.16.x (see crates/ghostty-sys/build.rs).
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@v2
      # The daemon has only ever been exercised on macOS; prove it on Linux
      # before shipping it there.
      - run: cargo test -p perchd
      - run: |
          cargo build --release -p perchd --target "$TARGET"
          cp "target/$TARGET/release/perchd" "perchd-linux-${{ matrix.arch }}"
          file "perchd-linux-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: perchd-linux-${{ matrix.arch }}
          path: perchd-linux-${{ matrix.arch }}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: perchd-linux-${{ matrix.arch }}

  # The headless core that Settings > Hosts > "Install perch-core" puts on a remote computer
  # (crates/perch-core/src/machine.rs downloads `perch-core-<os>-<arch>` and its `.sha256` from the
  # release). Linux is static musl, like the daemon; macOS is a plain release build.
  core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
            triple: x86_64-unknown-linux-musl
          - os: ubuntu-22.04-arm
            name: linux-aarch64
            triple: aarch64-unknown-linux-musl
          - os: macos-latest
            name: macos-aarch64
            triple: aarch64-apple-darwin
          # Built on the arm runner (cross-compiled; the smoke test checks its architecture), so an
          # Intel Mac gets the asset the probe and Install perch-core ask for.
          - os: macos-latest
            name: macos-x86_64
            triple: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      # The core tells a probe which release it came from, so an install fetches its own version.
      PERCH_RELEASE_TAG: ${{ github.ref_name }}
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # third_party/ghostty, built by ghostty-sys
      # The pinned Ghostty only builds with Zig 0.16.x (see crates/ghostty-sys/build.rs).
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p perch-core --target "${{ matrix.triple }}"
      - name: Name, smoke-test and checksum
        run: |
          cp "target/${{ matrix.triple }}/release/perch-core" "perch-core-${{ matrix.name }}"
          # --version answers without booting a server; it is what a machine probe runs. The Intel Mac
          # build is cross-compiled on an arm runner: check its architecture instead of relying on Rosetta.
          if [ "${{ matrix.name }}" = macos-x86_64 ]; then
            [ "$(lipo -archs "perch-core-${{ matrix.name }}")" = x86_64 ]
          else
            "./perch-core-${{ matrix.name }}" --version
          fi
          if [ "$(uname)" = Linux ]; then
            file "perch-core-${{ matrix.name }}"
            sha256sum "perch-core-${{ matrix.name }}" > "perch-core-${{ matrix.name }}.sha256"
          else
            shasum -a 256 "perch-core-${{ matrix.name }}" > "perch-core-${{ matrix.name }}.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: perch-core-${{ matrix.name }}
          path: perch-core-${{ matrix.name }}*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: perch-core-${{ matrix.name }}*
