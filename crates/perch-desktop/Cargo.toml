[package]
name = "perch-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tauri desktop shell for perch. Boots the perch-core axum server in-process, then opens a native window. Build on macOS."
build = "build.rs"

[dependencies]
perch-core = { path = "../perch-core" }
# `unstable` is `Window::add_child`, the child webviews of the built-in browser (src/browser.rs).
# `macos-private-api` is the transparent window the glass shell needs (src/glass.rs). It
# keeps the app out of the Mac App Store, which perch is not in (a sandbox cannot run shells).
tauri = { version = "2", features = ["unstable", "macos-private-api"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"
objc2 = "0.6"
# Use Tauri's already-transitive parser: its menu constructors silently ignore invalid keys.
muda = { version = "0.19", default-features = false }

[build-dependencies]
tauri-build = { version = "2", features = [] }
