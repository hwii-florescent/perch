[package]
name = "perch-desktop"
version.workspace = true
edition.workspace = true
description = "Tauri desktop shell for perch. NOT buildable on this devpod (no webkit2gtk/display) — build on Mac. See Phase 4 in plans.md."
build = "build.rs"

[dependencies]
perch-core = { path = "../perch-core" }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
