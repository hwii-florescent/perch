[package]
name = "perch-core"
version.workspace = true
edition.workspace = true
description = "Rust core for perch: agent runner, terminals, history db, WS server."

[[bin]]
name = "perch-core"
path = "src/main.rs"

[lib]
name = "perch_core"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync", "time"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Reads ~/.codex/config.toml at boot to locate the codex model catalogue
# (see models.rs). Parsing only — perch never writes codex config.
toml = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
portable-pty = "0.8"
perchd = { path = "../perchd" }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
libc = "0.2"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
tokio-tungstenite = "0.24"
# Used only for CLI-attached terminal blocked-state (approval-prompt)
# detection in server.rs — see `blocked_patterns`/`strip_ansi`.
regex = "1"
# OSC title tracking for agent status (`agent_title.rs`); already built for perchd.
vt100 = "0.15"
