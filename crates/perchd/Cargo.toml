[package]
name = "perchd"
version.workspace = true
edition.workspace = true
description = "perch terminal daemon: owns PTYs so agents outlive the runtime."

[[bin]]
name = "perchd"
path = "src/main.rs"

[lib]
name = "perchd"
path = "src/lib.rs"

[dependencies]
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
vt100 = "0.15"
