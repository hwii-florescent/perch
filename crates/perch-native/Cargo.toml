[package]
name = "perch-native"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native GPUI desktop client for a running perch-core."

[lib]
name = "perch_native"
path = "src/lib.rs"

[[bin]]
name = "perch-native"
path = "src/main.rs"

[dependencies]
perch-core = { path = "../perch-core" }
perchd = { path = "../perchd" }
ghostty-sys = { path = "../ghostty-sys" }
anyhow = "1"
# Reads the bundled symbols font's glyph outlines, the version GPUI's text system uses.
ttf-parser = "0.25"
# The version GPUI uses, for the frames it draws and the PNG images kitty graphics send.
image = { version = "0.25", default-features = false, features = ["png", "tiff", "bmp"] }
futures = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "fs"] }
tokio-tungstenite = "0.24"
# crates.io pre-release snapshot of Zed's GPUI, pinned exactly.
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit", "runtime_shaders"] }

[dev-dependencies]
libc = "0.2"
# `Window::render_to_image` and the Metal headless renderer exist only behind test-support.
gpui = { package = "gpui-pre", version = "=0.3.8", features = ["test-support"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit", "runtime_shaders", "test-support"] }

[[test]]
name = "terminal_session"
path = "tests/terminal_session.rs"
harness = false

[[test]]
name = "sidebar_render"
path = "tests/sidebar_render.rs"
harness = false

[[test]]
name = "terminal_render"
path = "tests/terminal_render.rs"
harness = false

[[test]]
name = "terminal_view"
path = "tests/terminal_view.rs"
harness = false

[[test]]
name = "workspace_render"
path = "tests/workspace_render.rs"
harness = false

[[test]]
name = "workspace_session"
path = "tests/workspace_session.rs"
harness = false

[[test]]
name = "workspace_lifecycle"
path = "tests/workspace_lifecycle.rs"
harness = false
