[package]
name = "perch-native"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native GPUI desktop client for a running perch-core."

[lib]
name = "perch_native"
path = "src/lib.rs"

[[bin]]
name = "perch-native"
path = "src/main.rs"

[dependencies]
perch-core = { path = "../perch-core" }
perchd = { path = "../perchd" }
ghostty-sys = { path = "../ghostty-sys" }
anyhow = "1"
# Reads the bundled symbols font's glyph outlines, the version GPUI's text system uses.
ttf-parser = "0.25"
# The version GPUI uses, for the frames it draws and the PNG images kitty graphics send.
image = { version = "0.25", default-features = false, features = ["png", "tiff", "bmp", "jpeg", "gif", "webp", "ico"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "fs"] }
tokio-tungstenite = "0.24"
# crates.io pre-release snapshot of Zed's GPUI, pinned exactly.
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit", "runtime_shaders"] }
# The JavaScript mod engine, vendored from herdr-app (see THIRD_PARTY_NOTICES.md).
gpui-shell = { path = "../../vendor/gpui-kit/crates/shell" }
gpui-base = { path = "../../vendor/gpui-kit/crates/base" }
# The grammars the editor highlights with: the vendored editor's own version and features.
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy"] }
# The version GPUI rasterises SVGs with: an icon's size is read before it is drawn.
usvg = { version = "0.46", default-features = false }
# WHATWG URL parsing for browser pages' addresses, the version GPUI already builds.
url = "2"
# Mod hot reload: the system's file events (FSEvents), the version herdr-app's gpui-kit names.
notify = "8.2"

# Browser pages: a WebKit child view (the version the Tauri app locks), with the AppKit calls wry does not make.
# Quick Look: the Foundation and AppKit versions GPUI's macOS platform already builds.
[target.'cfg(target_os = "macos")'.dependencies]
wry = { version = "0.55", default-features = false, features = ["os-webview"] }
objc2 = "0.6"
block2 = "0.6"
raw-window-handle = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSURL", "NSObject", "NSBundle", "NSError"] }
# Notifications under the app's own identity, the version and features the Tauri app uses.
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotification", "UNNotificationRequest", "UNNotificationContent", "UNNotificationResponse", "UNNotificationTrigger"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSResponder"] }

[dev-dependencies]
libc = "0.2"
# `Window::render_to_image` and the Metal headless renderer exist only behind test-support.
gpui = { package = "gpui-pre", version = "=0.3.8", features = ["test-support"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit", "runtime_shaders", "test-support"] }
gpui-shell = { path = "../../vendor/gpui-kit/crates/shell", features = ["render-test-support"] }

